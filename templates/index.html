<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Collector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="container">
        <h1>Feedback Collector</h1>
        <nav aria-label="Основная навигация">
            <a href="/" aria-current="page">Главная</a>
            <a href="/about">О проекте</a>
        </nav>
    </header>
    <main class="container">
        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">Оставить отзыв</h2>
            <form action="/feedback" method="post">
                <label for="author">Имя автора</label>
                <input type="text" id="author" name="author" autocomplete="name" required>

                <label for="message">Текст отзыва</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Отправить отзыв</button>
            </form>
        </section>
        <section class="panel" aria-labelledby="feedback-title">
            <h2 id="feedback-title">Отзывы</h2>
            <p class="total">Всего отзывов: {{.Total}}</p>
            {{if .Feedbacks}}
            <ul class="feedback-list">
                {{range .Feedbacks}}
                <li class="feedback">
                    <p class="feedback-id">ID: {{.ID}}</p>
                    <h3>{{.Author}}</h3>
                    <p class="message">{{.Message}}</p>
                </li>
                {{end}}
            </ul>
            {{else}}
            <p>Пока нет отзывов. Оставьте первый!</p>
            {{end}}
        </section>
    </main>
</body>
</html>
